<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" /> <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" /> </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg-gradient)"/>

  <path d="M128 384 L128 160 L256 288 L384 160 L384 384" 
        fill="none" 
        stroke="#a78bfa" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8" />

  <circle cx="128" cy="160" r="24" fill="#2dd4bf" filter="url(#glow)" />
  
  <circle cx="384" cy="160" r="24" fill="#2dd4bf" filter="url(#glow)" />
  
  <circle cx="256" cy="288" r="24" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite" />
  </circle>

</svg>